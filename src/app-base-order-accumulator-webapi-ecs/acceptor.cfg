# FIX 4.4 session of the acceptor (contracts.md §3); port and path of FIX44-flowa.xml are resolved at startup (FixAcceptorWorker).

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9876
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44-flowa.xml
# Validation stays strict: a user-defined field only passes if it is in the dictionary (tag 5100).
ValidateUserDefinedFields=Y
AllowUnknownMsgFields=N
# In-memory store and sequence reset on every logon, logout and disconnect (D-34): nothing stays on disk.
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDERACCUMULATOR
TargetCompID=ORDERGENERATOR
