# Sessão FIX do OrderGenerator (contrato v1, seção 3).
# Host e porta do acceptor vêm de Fix__AcceptorHost e Fix__AcceptorPort; os valores abaixo são o padrão local.
[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
HeartBtInt=30
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44-flowa.xml
# A validação continua estrita: campo de usuário só passa se estiver no dicionário (tag 5100).
ValidateUserDefinedFields=Y
AllowUnknownMsgFields=N
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y
ScreenLogShowIncoming=Y
ScreenLogShowOutgoing=Y
ScreenLogShowEvents=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDERGENERATOR
TargetCompID=ORDERACCUMULATOR
SocketConnectHost=localhost
SocketConnectPort=9876
