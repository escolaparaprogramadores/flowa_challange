# FIX session of the OrderGenerator (contract v1, section 3).
# Host and port of the acceptor come from Fix__AcceptorHost and Fix__AcceptorPort; the values below are the local default.
[DEFAULT]
ConnectionType=initiator
ReconnectInterval=2
HeartBtInt=30
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44-flowa.xml
# Validation stays strict: a user-defined field only passes if it is in the dictionary (tag 5100).
ValidateUserDefinedFields=Y
AllowUnknownMsgFields=N
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDERGENERATOR
TargetCompID=ORDERACCUMULATOR
SocketConnectHost=localhost
SocketConnectPort=9876
