# Sessão FIX 4.4 do OrderAccumulator (acceptor), conforme docs/contracts/contracts.md, seção 3.
# A porta vem de Fix__AcceptorPort e o caminho do dicionário FIX44.xml é resolvido na subida (FixAcceptorService).

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9876
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44.xml
# Store em memória e sequência zerada a cada logon, logout e queda (D-34): nada fica em disco.
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDERACCUMULATOR
TargetCompID=ORDERGENERATOR
