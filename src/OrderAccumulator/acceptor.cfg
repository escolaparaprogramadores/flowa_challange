# Sessão FIX 4.4 do acceptor (contracts.md §3); porta e caminho do FIX44.xml são resolvidos na subida (FixAcceptorService).

[DEFAULT]
ConnectionType=acceptor
SocketAcceptPort=9876
StartTime=00:00:00
EndTime=00:00:00
UseDataDictionary=Y
DataDictionary=FIX44.xml
# Store em memória e sequência zerada a cada logon, logout e queda (D-34): nada fica em disco.
ResetOnLogon=Y
ResetOnLogout=Y
ResetOnDisconnect=Y

[SESSION]
BeginString=FIX.4.4
SenderCompID=ORDERACCUMULATOR
TargetCompID=ORDERGENERATOR
