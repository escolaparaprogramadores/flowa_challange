# k6 OSS load test against the public URL. Manual dispatch only: each run sends ~4,500 real orders to
# the dev environment, so it must not run on every push.
name: k6-carga

on:
  workflow_dispatch:
    inputs:
      public_url:
        description: Origin of the public Flowa API, without a trailing slash
        required: true
        type: string
        default: https://h2asgc2sce.execute-api.us-east-1.amazonaws.com

permissions:
  contents: read

concurrency:
  group: k6-carga
  cancel-in-progress: false

jobs:
  load_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOWA_URL: ${{ inputs.public_url }}
      RESULT_DIR: k6-result
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: '2.3.0'

      - name: Check the URL and read the exposure before
        id: read_before_load
        run: |
          if ! printf '%s' "$FLOWA_URL" | grep -Eq '^https://[A-Za-z0-9.-]+$'; then
            echo "public_url must be https://<host>, with no path and no trailing slash." >&2
            exit 1
          fi
          mkdir -p "$RESULT_DIR"
          curl -fsS --max-time 15 "$FLOWA_URL/version" | tee "$RESULT_DIR/version.json"; echo
          curl -fsS --max-time 15 "$FLOWA_URL/api/exposures" | tee "$RESULT_DIR/exposure-before.json"; echo

      # k6 itself fails the run on errors, on a missing outcome kind per symbol and on exposure not restored.
      - name: Run k6
        run: k6 run --no-usage-report -e FLOWA_URL="$FLOWA_URL" -e FLOWA_SUMMARY_DIR="$RESULT_DIR" "performance test/carga-ordens.js"

      - name: Read the exposure after
        id: read_after_load
        if: always() && steps.read_before_load.outcome == 'success'
        run: curl -fsS --max-time 15 "$FLOWA_URL/api/exposures" | tee "$RESULT_DIR/exposure-after.json"; echo

      - name: Show the summary on the run page
        if: always() && steps.read_before_load.outcome == 'success'
        run: |
          if [ -f "$RESULT_DIR/load-summary.md" ]; then
            cat "$RESULT_DIR/load-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compare the exposure before and after
        if: always() && steps.read_after_load.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            const resultDir = process.env.RESULT_DIR;
            const readExposureBySymbol = (exposureFile) => Object.fromEntries(
              JSON.parse(fs.readFileSync(`${resultDir}/${exposureFile}`, "utf8")).data.exposures
                .map((symbolExposure) => [symbolExposure.symbol, symbolExposure.exposure]));
            const exposureBefore = readExposureBySymbol("exposure-before.json");
            const exposureAfter = readExposureBySymbol("exposure-after.json");
            const exposureDifferences = Object.keys(exposureBefore).map((symbol) => ({
              symbol,
              before: exposureBefore[symbol],
              after: exposureAfter[symbol],
              difference: Math.round((exposureAfter[symbol] - exposureBefore[symbol]) * 100) / 100,
            }));
            fs.writeFileSync(`${resultDir}/exposure-difference.json`, JSON.stringify(exposureDifferences, null, 2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "", "## Exposure read by the workflow", "",
              "| Symbol | Before | After | Difference |", "|---|---|---|---|",
              ...exposureDifferences.map((symbolDifference) => `| ${symbolDifference.symbol} `
                + `| ${symbolDifference.before} | ${symbolDifference.after} | ${symbolDifference.difference} |`), "",
            ].join("\n"));
          '

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.read_before_load.outcome == 'success'
        with:
          name: k6-result-${{ github.run_id }}
          path: ${{ env.RESULT_DIR }}/
          if-no-files-found: error
          retention-days: 30
