name: CI

# Confere build e testes em cada PR, para nada entrar em develop ou main sem passar.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Flowa.Shared/Flowa.Shared.csproj
      - run: dotnet test tests/Flowa.Shared.Tests/Flowa.Shared.Tests.csproj
