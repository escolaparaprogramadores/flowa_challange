name: Deploy dev

# A cada merge em develop que mude mais que texto: o CI roda no mesmo commit e, só com ele verde, a
# imagem de cada serviço que mudou vai para o ECR e o terraform apply roda na conta do flowa (D-41).
# O repositório é público, então nada da conta aparece no log: role, bucket e registro vêm de secrets,
# e a saída do Terraform fica num arquivo do runner, com só o resumo no log.
on:
  push:
    branches: [develop]
    # Merge só de texto não refaz imagem nem troca task (CA-O22).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: [ci]
    # O disparo manual também só publica o que está em develop.
    if: github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    # Um apply por vez, e o que está rodando nunca é cancelado. Se chegarem dois merges durante um
    # apply, só o mais novo fica na fila (o GitHub descarta o pendente mais antigo); ele já contém o outro.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # ARM64 nativo: as imagens rodam em Fargate ARM64 e o build não precisa de emulação.
    runs-on: ubuntu-24.04-arm
    environment: dev
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A tag em uso de cada serviço é um commit antigo de develop, e a escolha da tag compara com ele.
          fetch-depth: 0

      # O CI de dois merges roda em paralelo, e sem isto o deploy do mais velho poderia terminar por cima
      # do mais novo. Se develop já tem código depois deste commit, o run daquele merge publica tudo.
      - name: Conferir se este commit ainda é o mais novo de develop
        id: ponta
        run: |
          git fetch --quiet origin develop
          ponta_de_develop=$(git rev-parse FETCH_HEAD)
          if [ "$ponta_de_develop" != "$GITHUB_SHA" ] &&
             git diff --name-only "$GITHUB_SHA" "$ponta_de_develop" | grep -qvE '\.md$|^docs/'; then
            echo "develop já tem código mais novo ($ponta_de_develop); o run daquele merge publica"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Conferir se há infra
        id: infra
        if: steps.ponta.outputs.publicar == 'true'
        run: |
          if [ -d infra ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "nada a aplicar: infra/ não existe"
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Credencial AWS por OIDC
        if: steps.infra.outputs.existe == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Login no ECR
        if: steps.infra.outputs.existe == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # CA-O24: um serviço só ganha imagem nova quando muda o que o Dockerfile dele copia. A comparação é
      # com a tag em uso (o commit da imagem que roda hoje), não com o push anterior: assim um deploy que
      # falhou não deixa mudança para trás. A imagem não vai para o log, porque o endereço tem a conta.
      - name: Escolher a tag de cada serviço
        id: tags
        if: steps.infra.outputs.existe == 'true'
        run: |
          entradas_da_imagem_do_servico() {
            dockerfile_do_servico=$1
            echo "$dockerfile_do_servico"
            echo .dockerignore
            # Origens de cada COPY/ADD que lê do repositório (não de outro estágio), sem as opções --x.
            awk 'toupper($1) == "COPY" || toupper($1) == "ADD" {
                   # Forma JSON, linha quebrada com "\" ou heredoc: sem ler as origens com certeza, vale o
                   # repositório inteiro, e qualquer mudança refaz a imagem.
                   if ($0 ~ /\[|\\[[:space:]]*$|<</) { print "."; next }
                   copia_de_outro_estagio = 0; quantidade_de_argumentos = 0
                   for (i = 2; i <= NF; i++) {
                     if ($i ~ /^--from=/) copia_de_outro_estagio = 1
                     else if ($i !~ /^--/) argumentos_da_copia[++quantidade_de_argumentos] = $i
                   }
                   if (!copia_de_outro_estagio)
                     for (i = 1; i < quantidade_de_argumentos; i++) print argumentos_da_copia[i]
                 }' "$dockerfile_do_servico" | sed -E 's#^\./##; s#/$##'
          }

          esconder_conta_do_erro_da_aws() {
            sed -E 's/arn:aws[^ "]*/<arn oculto>/g; s/[0-9]{12}/<conta>/g' "$1" >&2
          }

          tag_da_imagem_em_uso_no_servico() {
            nome_do_servico_no_ecs=$1
            nome_do_container=$2
            erro_da_leitura_do_ecs="$RUNNER_TEMP/ecs-$nome_do_container.log"
            if ! definicao_da_task_em_uso=$(aws ecs describe-services --cluster flowa-challenge \
                 --services "$nome_do_servico_no_ecs" --query 'services[?status==`ACTIVE`].taskDefinition | [0]' \
                 --output text 2> "$erro_da_leitura_do_ecs"); then
              # Sem cluster ainda (primeiro deploy) é o mesmo que serviço sem task: imagem nova.
              grep -q ClusterNotFoundException "$erro_da_leitura_do_ecs" && return 0
              esconder_conta_do_erro_da_aws "$erro_da_leitura_do_ecs"
              return 1
            fi
            if [ -z "$definicao_da_task_em_uso" ] || [ "$definicao_da_task_em_uso" = "None" ]; then
              return 0
            fi
            if ! imagem_em_uso=$(aws ecs describe-task-definition --task-definition "$definicao_da_task_em_uso" \
                 --query "taskDefinition.containerDefinitions[?name=='$nome_do_container'].image | [0]" \
                 --output text 2> "$erro_da_leitura_do_ecs"); then
              esconder_conta_do_erro_da_aws "$erro_da_leitura_do_ecs"
              return 1
            fi
            echo "${imagem_em_uso##*:}"
          }

          for servico_container_e_pasta in flowa-challenge-order-generator:generator:OrderGenerator \
                                           flowa-challenge-order-accumulator:accumulator:OrderAccumulator; do
            IFS=: read -r nome_do_servico_no_ecs nome_do_container pasta_do_servico <<< "$servico_container_e_pasta"
            tag_em_uso=$(tag_da_imagem_em_uso_no_servico "$nome_do_servico_no_ecs" "$nome_do_container")
            mapfile -t entradas_da_imagem < <(entradas_da_imagem_do_servico "src/$pasta_do_servico/Dockerfile")
            if [[ "$tag_em_uso" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$tag_em_uso^{commit}" 2> /dev/null &&
               git diff --quiet "$tag_em_uso" "$GITHUB_SHA" -- "${entradas_da_imagem[@]}"; then
              echo "$pasta_do_servico: nada mudou no que a imagem copia desde $tag_em_uso; a task fica como está"
              echo "${nome_do_container}_tag=$tag_em_uso" >> "$GITHUB_OUTPUT"
              echo "${nome_do_container}_construir=false" >> "$GITHUB_OUTPUT"
            else
              echo "$pasta_do_servico: imagem nova com a tag $GITHUB_SHA"
              echo "${nome_do_container}_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              echo "${nome_do_container}_construir=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # Sem o wrapper: ele repetiria a saída inteira do Terraform no log.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.infra.outputs.existe == 'true'
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # Roda o Terraform com a saída num arquivo. Se falhar, o log mostra só as linhas de erro.
      - name: Preparar o Terraform sem eco no log
        if: steps.infra.outputs.existe == 'true'
        run: |
          cat > "$RUNNER_TEMP/terraform-quieto.sh" <<'FIM'
          terraform_quieto() {
            subcomando_terraform=$1
            shift
            TERRAFORM_LOG="$RUNNER_TEMP/terraform-$subcomando_terraform-$(date +%s%N).log"
            if ! terraform "$subcomando_terraform" -no-color "$@" > "$TERRAFORM_LOG" 2>&1; then
              # Erro da AWS costuma trazer o ARN de quem chamou; no log público ele vira <arn oculto>.
              grep -E 'Error' "$TERRAFORM_LOG" | sed -E 's/arn:aws[^ "]*/<arn oculto>/g' >&2 || true
              echo "terraform $subcomando_terraform falhou; a saída completa fica só no runner" >&2
              return 1
            fi
          }
          FIM

      - name: terraform init e repositórios ECR
        if: steps.infra.outputs.existe == 'true'
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          source "$RUNNER_TEMP/terraform-quieto.sh"
          terraform_quieto init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=flowa/dev.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          echo "terraform init ok"

          # O ECR precisa existir antes do push das imagens.
          mapfile -t alvos_terraform_dos_repositorios_ecr < <(grep -hoE '^resource "aws_ecr_repository" "[A-Za-z0-9_-]+"' ./*.tf |
            awk -F'"' '{ print "-target=aws_ecr_repository." $4 }')
          if [ "${#alvos_terraform_dos_repositorios_ecr[@]}" -eq 0 ]; then
            echo "nenhum resource \"aws_ecr_repository\" em infra/*.tf" >&2
            exit 1
          fi
          terraform_quieto apply -auto-approve "${alvos_terraform_dos_repositorios_ecr[@]}"
          printf '%s\n' "${alvos_terraform_dos_repositorios_ecr[@]}" | sed 's/^-target=/ECR: /'
          grep -E '^Apply complete!' "$TERRAFORM_LOG"

      - name: Imagens ARM64 no ECR
        if: steps.infra.outputs.existe == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          CONSTRUIR_IMAGEM_DO_GENERATOR: ${{ steps.tags.outputs.generator_construir }}
          CONSTRUIR_IMAGEM_DO_ACCUMULATOR: ${{ steps.tags.outputs.accumulator_construir }}
        run: |
          for servico_repositorio_e_decisao in \
              "OrderGenerator:flowa-challenge-order-generator:$CONSTRUIR_IMAGEM_DO_GENERATOR" \
              "OrderAccumulator:flowa-challenge-order-accumulator:$CONSTRUIR_IMAGEM_DO_ACCUMULATOR"; do
            IFS=: read -r servico_flowa repositorio_ecr construir_imagem_do_servico <<< "$servico_repositorio_e_decisao"
            if [ "$construir_imagem_do_servico" != "true" ]; then
              echo "$servico_flowa: sem imagem nova; continua a que já roda"
              continue
            fi
            imagem_do_servico_no_ecr="$ECR_REGISTRY/$repositorio_ecr:$GITHUB_SHA"
            # Rodar de novo no mesmo commit não refaz a imagem que já está lá.
            if docker manifest inspect "$imagem_do_servico_no_ecr" > /dev/null 2>&1; then
              echo "$servico_flowa: imagem deste commit já está no ECR"
              continue
            fi
            # Sem o SHA o app não sobe e o /version volta vazio.
            docker build --platform linux/arm64 --build-arg SOURCE_REVISION_ID="$GITHUB_SHA" \
              -f "src/$servico_flowa/Dockerfile" -t "$imagem_do_servico_no_ecr" .
            docker push --quiet "$imagem_do_servico_no_ecr" > /dev/null
            echo "$servico_flowa: imagem enviada com a tag $GITHUB_SHA"
          done

      - name: terraform plan e apply
        if: steps.infra.outputs.existe == 'true'
        working-directory: infra
        env:
          TAG_DA_IMAGEM_DO_GENERATOR: ${{ steps.tags.outputs.generator_tag }}
          TAG_DA_IMAGEM_DO_ACCUMULATOR: ${{ steps.tags.outputs.accumulator_tag }}
        run: |
          source "$RUNNER_TEMP/terraform-quieto.sh"
          terraform_quieto plan -out=tfplan \
            -var "generator_image_tag=$TAG_DA_IMAGEM_DO_GENERATOR" \
            -var "accumulator_image_tag=$TAG_DA_IMAGEM_DO_ACCUMULATOR"
          grep -E '^(Plan:|No changes|Changes to Outputs)' "$TERRAFORM_LOG" || echo "plan sem linha de resumo"
          grep -E '^  # [a-z]' "$TERRAFORM_LOG" | sed -E 's/^  # //' || true

          terraform_quieto apply tfplan
          grep -E '^Apply complete!' "$TERRAFORM_LOG"
