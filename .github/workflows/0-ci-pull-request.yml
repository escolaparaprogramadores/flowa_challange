name: CI

# Roda o build e todos os testes em cada PR para develop e main e em cada push para main. Em develop quem
# chama este CI é a esteira de deploy (2-develop.yml), que só publica com ele verde no mesmo commit.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # A tela vem antes do .NET: o build do Vite grava src/app-base-order-generator-webapi-ecs/wwwroot, que os testes
      # de página do OrderGenerator servem.
      - name: Tela — instalar
        working-directory: frontend
        run: npm ci
      - name: Tela — tipos e build
        working-directory: frontend
        run: npm run build
      - name: Tela — testes de unidade
        working-directory: frontend
        run: npm test
      - name: Tela — sem valores crus fora do tema (CA-23)
        working-directory: frontend
        run: node e2e/sem-valores-crus.mjs

      # Sem filtro: entram os testes com PostgreSQL em container e os de integração com o compose.
      # O Docker é o do próprio runner.
      - run: dotnet build Flowa.slnx
      - run: dotnet test Flowa.slnx --no-build -m:1

  e2e-tela:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Playwright — instalar
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Subir o compose
        id: compose
        run: docker compose up -d --build --wait --wait-timeout 180
      # O OrderGenerator não tem healthcheck no compose, e a ordem só sai depois do logon FIX.
      - name: Esperar a página e a sessão FIX
        run: |
          for tentativa_de_ver_pagina_e_sessao_fix in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health > /dev/null 2>&1 &&
               docker compose logs --no-color ordergenerator | tr '\001' '|' | grep -q '35=A|.*49=ORDERACCUMULATOR'; then
              echo "página de pé e sessão FIX aberta"
              exit 0
            fi
            sleep 2
          done
          echo "a página ou a sessão FIX não ficaram prontas em 120 s" >&2
          exit 1
      - name: E2E da tela com tudo de pé
        working-directory: frontend
        run: npx playwright test
      # CA-19: a tela com o OrderAccumulator fora do ar. Roda mesmo se a suíte de cima falhar.
      - name: Parar o OrderAccumulator
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        run: docker compose stop orderaccumulator
      - name: E2E da tela sem o OrderAccumulator
        if: ${{ !cancelled() && steps.compose.outcome == 'success' }}
        working-directory: frontend
        run: npx playwright test -c playwright.sem-accumulator.config.ts
      - name: Log dos apps em caso de falha
        if: failure()
        run: docker compose logs --no-color ordergenerator orderaccumulator
      - name: Derrubar o compose
        if: always()
        run: docker compose down -v
