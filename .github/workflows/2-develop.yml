name: Deploy dev

# On each merge to develop that changes more than text: the CI runs on the same commit and, only with it green,
# the image of each changed service goes to ECR and terraform apply runs in the flowa account (D-41).
# The repository is public, so nothing of the account shows in the log: role, bucket and registry come from
# secrets, and the Terraform output stays in a file on the runner, with only the summary in the log.
on:
  push:
    branches: [develop]
    # A text-only merge neither rebuilds an image nor replaces a task (CA-O22).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/0-ci-pull-request.yml

  deploy:
    needs: [ci]
    # The manual trigger also only publishes what is in develop.
    if: github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
      contents: read
    # One apply at a time, and the running one is never cancelled. If two merges arrive during an
    # apply, only the newest stays queued (GitHub drops the older pending one); it already contains the other.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    # Native ARM64: the images run on Fargate ARM64 and the build needs no emulation.
    runs-on: ubuntu-24.04-arm
    environment: dev
    timeout-minutes: 45
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag in use of each service is an old develop commit, and the tag choice compares against it.
          fetch-depth: 0

      # The CI of two merges runs in parallel, and without this the deploy of the older one could finish on top
      # of the newer one. If develop already has code after this commit, the run of that merge publishes it all.
      - name: Check that this commit is still the newest of develop
        id: develop_tip
        run: |
          git fetch --quiet origin develop
          develop_tip_commit=$(git rev-parse FETCH_HEAD)
          if [ "$develop_tip_commit" != "$GITHUB_SHA" ] &&
             git diff --name-only "$GITHUB_SHA" "$develop_tip_commit" | grep -qvE '\.md$|^docs/'; then
            echo "develop already has newer code ($develop_tip_commit); the run of that merge publishes"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that there is infra
        id: infra
        if: steps.develop_tip.outputs.publish == 'true'
        run: |
          if [ -d infra ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to apply: infra/ does not exist"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: AWS credentials through OIDC
        if: steps.infra.outputs.exists == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: ECR login
        if: steps.infra.outputs.exists == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # CA-O24: a service only gets a new image when what its Dockerfile copies changes. The comparison is
      # with the tag in use (the commit of the image running today), not with the previous push: this way a
      # failed deploy leaves no change behind. The image does not go to the log, because its address has the account.
      - name: Choose the tag of each service
        id: tags
        if: steps.infra.outputs.exists == 'true'
        run: |
          service_image_inputs() {
            service_dockerfile=$1
            echo "$service_dockerfile"
            echo .dockerignore
            # Sources of each COPY/ADD that reads from the repository (not from another stage), without the --x options.
            awk 'toupper($1) == "COPY" || toupper($1) == "ADD" {
                   # JSON form, line broken with "\" or heredoc: without reading the sources for sure, the whole
                   # repository counts, and any change rebuilds the image.
                   if ($0 ~ /\[|\\[[:space:]]*$|<</) { print "."; next }
                   copies_from_other_stage = 0; copy_argument_count = 0
                   for (i = 2; i <= NF; i++) {
                     if ($i ~ /^--from=/) copies_from_other_stage = 1
                     else if ($i !~ /^--/) copy_arguments[++copy_argument_count] = $i
                   }
                   if (!copies_from_other_stage)
                     for (i = 1; i < copy_argument_count; i++) print copy_arguments[i]
                 }' "$service_dockerfile" | sed -E 's#^\./##; s#/$##'
          }

          hide_account_in_aws_error() {
            sed -E 's/arn:aws[^ "]*/<hidden arn>/g; s/[0-9]{12}/<account>/g' "$1" >&2
          }

          service_image_tag_in_use() {
            ecs_service_name=$1
            container_name=$2
            ecs_read_error_file="$RUNNER_TEMP/ecs-$container_name.log"
            if ! task_definition_in_use=$(aws ecs describe-services --cluster flowa-challenge \
                 --services "$ecs_service_name" --query 'services[?status==`ACTIVE`].taskDefinition | [0]' \
                 --output text 2> "$ecs_read_error_file"); then
              # No cluster yet (first deploy) is the same as a service without a task: new image.
              grep -q ClusterNotFoundException "$ecs_read_error_file" && return 0
              hide_account_in_aws_error "$ecs_read_error_file"
              return 1
            fi
            if [ -z "$task_definition_in_use" ] || [ "$task_definition_in_use" = "None" ]; then
              return 0
            fi
            if ! image_in_use=$(aws ecs describe-task-definition --task-definition "$task_definition_in_use" \
                 --query "taskDefinition.containerDefinitions[?name=='$container_name'].image | [0]" \
                 --output text 2> "$ecs_read_error_file"); then
              hide_account_in_aws_error "$ecs_read_error_file"
              return 1
            fi
            echo "${image_in_use##*:}"
          }

          for service_container_and_folder in flowa-challenge-order-generator:generator:app-base-order-generator-webapi-ecs \
                                           flowa-challenge-order-accumulator:accumulator:app-base-order-accumulator-webapi-ecs; do
            IFS=: read -r ecs_service_name container_name service_folder <<< "$service_container_and_folder"
            tag_in_use=$(service_image_tag_in_use "$ecs_service_name" "$container_name")
            mapfile -t image_inputs < <(service_image_inputs "src/$service_folder/Dockerfile")
            if [[ "$tag_in_use" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$tag_in_use^{commit}" 2> /dev/null &&
               git diff --quiet "$tag_in_use" "$GITHUB_SHA" -- "${image_inputs[@]}"; then
              echo "$service_folder: nothing changed in what the image copies since $tag_in_use; the task stays as it is"
              echo "${container_name}_tag=$tag_in_use" >> "$GITHUB_OUTPUT"
              echo "${container_name}_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "$service_folder: new image with the tag $GITHUB_SHA"
              echo "${container_name}_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
              echo "${container_name}_build=true" >> "$GITHUB_OUTPUT"
            fi
          done

      # Without the wrapper: it would repeat the whole Terraform output in the log.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.infra.outputs.exists == 'true'
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      # Runs Terraform with the output in a file. If it fails, the log shows only the error lines.
      - name: Prepare Terraform without echo in the log
        if: steps.infra.outputs.exists == 'true'
        run: |
          cat > "$RUNNER_TEMP/terraform-quieto.sh" <<'FIM'
          terraform_quieto() {
            subcomando_terraform=$1
            shift
            TERRAFORM_LOG="$RUNNER_TEMP/terraform-$subcomando_terraform-$(date +%s%N).log"
            if ! terraform "$subcomando_terraform" -no-color "$@" > "$TERRAFORM_LOG" 2>&1; then
              # Erro da AWS costuma trazer o ARN de quem chamou; no log público ele vira <arn oculto>.
              grep -E 'Error' "$TERRAFORM_LOG" | sed -E 's/arn:aws[^ "]*/<arn oculto>/g' >&2 || true
              echo "terraform $subcomando_terraform falhou; a saída completa fica só no runner" >&2
              return 1
            fi
          }
          FIM

      - name: terraform init and ECR repositories
        if: steps.infra.outputs.exists == 'true'
        working-directory: infra
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          source "$RUNNER_TEMP/terraform-quieto.sh"
          terraform_quieto init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=flowa/dev.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
          echo "terraform init ok"

          # The ECR has to exist before the images are pushed.
          mapfile -t ecr_repository_targets < <(grep -hoE '^resource "aws_ecr_repository" "[A-Za-z0-9_-]+"' ./*.tf |
            awk -F'"' '{ print "-target=aws_ecr_repository." $4 }')
          if [ "${#ecr_repository_targets[@]}" -eq 0 ]; then
            echo "no resource \"aws_ecr_repository\" in infra/*.tf" >&2
            exit 1
          fi
          terraform_quieto apply -auto-approve "${ecr_repository_targets[@]}"
          printf '%s\n' "${ecr_repository_targets[@]}" | sed 's/^-target=/ECR: /'
          grep -E '^Apply complete!' "$TERRAFORM_LOG"

      - name: ARM64 images in ECR
        if: steps.infra.outputs.exists == 'true'
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          BUILD_GENERATOR_IMAGE: ${{ steps.tags.outputs.generator_build }}
          BUILD_ACCUMULATOR_IMAGE: ${{ steps.tags.outputs.accumulator_build }}
        run: |
          for service_repository_and_decision in \
              "app-base-order-generator-webapi-ecs:flowa-challenge-order-generator:$BUILD_GENERATOR_IMAGE" \
              "app-base-order-accumulator-webapi-ecs:flowa-challenge-order-accumulator:$BUILD_ACCUMULATOR_IMAGE"; do
            IFS=: read -r service_folder ecr_repository build_service_image <<< "$service_repository_and_decision"
            if [ "$build_service_image" != "true" ]; then
              echo "$service_folder: no new image; the running one stays"
              continue
            fi
            service_image_in_ecr="$ECR_REGISTRY/$ecr_repository:$GITHUB_SHA"
            # Running again on the same commit does not rebuild the image that is already there.
            if docker manifest inspect "$service_image_in_ecr" > /dev/null 2>&1; then
              echo "$service_folder: the image of this commit is already in ECR"
              continue
            fi
            # Without the SHA the app does not start and /version comes back empty.
            docker build --platform linux/arm64 --build-arg SOURCE_REVISION_ID="$GITHUB_SHA" \
              -f "src/$service_folder/Dockerfile" -t "$service_image_in_ecr" .
            docker push --quiet "$service_image_in_ecr" > /dev/null
            echo "$service_folder: image pushed with the tag $GITHUB_SHA"
          done

      # Turns the Datadog agent on only when the vault already has the key: without it the agent does not start and
      # the task would be bigger for nothing. Reads only the version stages; the pipeline cannot even read the value.
      - name: Check that the Datadog vault has the key
        id: datadog
        if: steps.infra.outputs.exists == 'true'
        env:
          # To take the agent out of the tasks, change to "false".
          DATADOG_AGENT_WANTED: "true"
        run: |
          if [ "$DATADOG_AGENT_WANTED" != "true" ]; then
            echo "Datadog agent switched off in the pipeline"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An AWS error carries ARN and account; that is why its output does not go to the log.
          if ! version_stages=$(aws secretsmanager describe-secret --secret-id flowa-challenge/dev/datadog/api-key \
               --query VersionIdsToStages --output json 2> /dev/null); then
            echo "could not query the Datadog vault; the deploy stops before the plan" >&2
            exit 1
          fi
          if grep -q '"AWSCURRENT"' <<< "$version_stages"; then
            echo "Datadog vault has the key: the agent starts in both tasks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Datadog vault does not have the key yet; the tasks start without the agent."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: terraform plan and apply
        if: steps.infra.outputs.exists == 'true'
        working-directory: infra
        env:
          GENERATOR_IMAGE_TAG: ${{ steps.tags.outputs.generator_tag }}
          ACCUMULATOR_IMAGE_TAG: ${{ steps.tags.outputs.accumulator_tag }}
          AGENTE_DATADOG_LIGADO: ${{ steps.datadog.outputs.enabled }}
        run: |
          source "$RUNNER_TEMP/terraform-quieto.sh"
          terraform_quieto plan -out=tfplan \
            -var "generator_image_tag=$GENERATOR_IMAGE_TAG" \
            -var "accumulator_image_tag=$ACCUMULATOR_IMAGE_TAG" \
            -var "datadog_ligado=$AGENTE_DATADOG_LIGADO"
          grep -E '^(Plan:|No changes|Changes to Outputs)' "$TERRAFORM_LOG" || echo "plan without a summary line"
          grep -E '^  # [a-z]' "$TERRAFORM_LOG" | sed -E 's/^  # //' || true

          # Plan guard: only the two task definitions may be destroyed or replaced (every image deploy replaces
          # them); only they and the log collector's task roles may be created, and those roles may only be
          # removed when Datadog is switched off. Anything else stops the run here, before apply. The plan JSON
          # stays on the runner. New resources in infra/ must be added to these lists.
          terraform show -json tfplan > "$RUNNER_TEMP/deploy-plan.json"
          jq -r '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"])
            | "plan: \(.change.actions | join("/")) \(.address)"' "$RUNNER_TEMP/deploy-plan.json"
          replaceable_task_definitions='["aws_ecs_task_definition.tarefa_do_order_generator",
            "aws_ecs_task_definition.tarefa_do_order_accumulator"]'
          log_collector_roles='["aws_iam_role.role_da_tarefa_dos_servicos_flowa[\"generator\"]",
            "aws_iam_role.role_da_tarefa_dos_servicos_flowa[\"accumulator\"]",
            "aws_iam_role_policy.permissoes_da_tarefa_dos_servicos_flowa[\"generator\"]",
            "aws_iam_role_policy.permissoes_da_tarefa_dos_servicos_flowa[\"accumulator\"]"]'
          disallowed_plan_changes=$(jq -r --arg datadog_enabled "$AGENTE_DATADOG_LIGADO" \
            --argjson replaceable "$replaceable_task_definitions" --argjson collector_roles "$log_collector_roles" \
            '($replaceable + (if $datadog_enabled == "true" then [] else $collector_roles end)) as $deletable
            | ($replaceable + $collector_roles) as $creatable
            | .resource_changes[]
            | select(((.change.actions | index("delete")) and (.address | IN($deletable[]) | not))
              or ((.change.actions | index("create")) and (.address | IN($creatable[]) | not)))
            | "\(.change.actions | join("/")) \(.address)"' "$RUNNER_TEMP/deploy-plan.json")
          if [ -n "$disallowed_plan_changes" ]; then
            echo "the plan destroys, replaces or creates a resource outside the allowed list; apply will not run:" >&2
            echo "$disallowed_plan_changes" >&2
            exit 1
          fi

          terraform_quieto apply tfplan
          grep -E '^Apply complete!' "$TERRAFORM_LOG"
