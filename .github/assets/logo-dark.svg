<svg xmlns="http://www.w3.org/2000/svg" width="599" height="200" viewBox="0 0 599 200" role="img" aria-label="Base investimentos">
  <title>Base investimentos</title>
  <defs>
    <linearGradient id="gradiente-do-icone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E9E78"/>
      <stop offset="1" stop-color="#4FE3B0"/>
    </linearGradient>
    <linearGradient id="gradiente-do-nome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E9E78"/>
      <stop offset="1" stop-color="#4FE3B0"/>
    </linearGradient>
    <radialGradient id="brilho-do-icone" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra-do-icone" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1E9E78" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g transform="translate(16 36)">
    <rect width="128" height="128" rx="32" fill="url(#gradiente-do-icone)" filter="url(#sombra-do-icone)"/>
    <rect width="128" height="128" rx="32" fill="url(#brilho-do-icone)"/>
    <text x="64" y="64" dy="0.35em" text-anchor="middle" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#FFFFFF">BI</text>
  </g>
  <text x="176" y="74" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC" textLength="143" lengthAdjust="spacingAndGlyphs">Base</text>
  <text x="176" y="138" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC" textLength="407" lengthAdjust="spacingAndGlyphs"><tspan fill="#F8FAFC"></tspan><tspan fill="url(#gradiente-do-nome)">investimentos</tspan><tspan fill="#F8FAFC"></tspan></text>
  <text x="178" y="182" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="500" fill="#94A3B8" textLength="207" lengthAdjust="spacing">Boleta de ordens</text>
</svg>
